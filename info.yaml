# Tiny Tapeout project information
project:
  title: "Sumador de 8 bits"
  author: "Jesús Eduardo Martínez Tinajero"
  discord: ""
  description: "Suma dos números de 8 bits y muestra el resultado."
  language: "Verilog"
  clock_hz: 0
  tiles: "1x1"
  top_module: "tt_um_8bitadder"

  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs: número A
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "A4"
  ui[5]: "A5"
  ui[6]: "A6"
  ui[7]: "A7"

  # Outputs: ocho bits inferiores de la suma
  uo[0]: "SUM0"
  uo[1]: "SUM1"
  uo[2]: "SUM2"
  uo[3]: "SUM3"
  uo[4]: "SUM4"
  uo[5]: "SUM5"
  uo[6]: "SUM6"
  uo[7]: "SUM7"

  # Inputs: número B
  uio[0]: "B0"
  uio[1]: "B1"
  uio[2]: "B2"
  uio[3]: "B3"
  uio[4]: "B4"
  uio[5]: "B5"
  uio[6]: "B6"
  uio[7]: "B7"

# Do not change!
yaml_version: 6
